<svg width="360" height="420" viewBox="0 0 360 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#00C9A7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="130" y1="195" x2="230" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243B55"/>
      <stop offset="1" stop-color="#141E30"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="352" height="412" rx="16" stroke="url(#cardGlow)" stroke-width="2"/>
  <rect x="6" y="6" width="348" height="408" rx="14" fill="#0D1117"/>

  <!-- mini title bar -->
  <circle cx="26" cy="26" r="4" fill="#FF5F56"/>
  <circle cx="40" cy="26" r="4" fill="#FFBD2E"/>
  <circle cx="54" cy="26" r="4" fill="#27C93F"/>
  <text x="180" y="30" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11" fill="#8B949E">~/mahee — dev · musician</text>
  <line x1="6" y1="42" x2="354" y2="42" stroke="#21262D" stroke-width="1"/>

  <!-- floating code symbols (left) -->
  <g font-family="Consolas, 'Fira Code', monospace" font-weight="bold">
    <text x="42" y="120" font-size="20" fill="#6C63FF" opacity="0.9">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="185" font-size="16" fill="#00C9A7" opacity="0.85">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="52" y="245" font-size="18" fill="#4B9FE1" opacity="0.8">=&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- music equalizer (right) -->
  <g>
    <text x="296" y="118" font-family="Consolas, monospace" font-size="18" fill="#00C9A7">♪
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="322" y="150" font-family="Consolas, monospace" font-size="14" fill="#6C63FF">♫
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <!-- bars -->
    <rect x="286" y="196" width="8" height="34" rx="3" fill="#6C63FF">
      <animate attributeName="height" values="34;14;34" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="196;216;196" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="184" width="8" height="46" rx="3" fill="#00C9A7">
      <animate attributeName="height" values="46;20;46" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="184;210;184" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="314" y="202" width="8" height="28" rx="3" fill="#4B9FE1">
      <animate attributeName="height" values="28;44;28" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="202;186;202" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="328" y="192" width="8" height="38" rx="3" fill="#A5B4FC">
      <animate attributeName="height" values="38;16;38" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="192;214;192" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ character ═══ -->
  <!-- torso / hoodie -->
  <rect x="128" y="196" width="104" height="94" rx="26" fill="url(#hoodie)"/>
  <!-- hoodie strings -->
  <line x1="170" y1="204" x2="170" y2="226" stroke="#00C9A7" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="204" x2="190" y2="226" stroke="#00C9A7" stroke-width="3" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="180" cy="146" r="40" fill="#C98E5A"/>
  <!-- hair -->
  <path d="M140 146 a40 40 0 0 1 80 0 l0 -10 q-6 -26 -40 -30 q-34 4 -40 30 Z" fill="#171B22"/>
  <path d="M140 146 q-2 -20 12 -30 q-4 14 2 22 Z" fill="#171B22"/>
  <path d="M220 146 q2 -20 -12 -30 q4 14 -2 22 Z" fill="#171B22"/>
  <!-- beard -->
  <path d="M156 172 q24 20 48 0 q-4 16 -24 17 q-20 -1 -24 -17 Z" fill="#171B22" opacity="0.85"/>
  <!-- glasses -->
  <circle cx="166" cy="148" r="11" stroke="#E6EDF3" stroke-width="2.5" fill="#0D1117" fill-opacity="0.25"/>
  <circle cx="194" cy="148" r="11" stroke="#E6EDF3" stroke-width="2.5" fill="#0D1117" fill-opacity="0.25"/>
  <line x1="177" y1="148" x2="183" y2="148" stroke="#E6EDF3" stroke-width="2.5"/>
  <!-- eyes behind glasses -->
  <circle cx="166" cy="149" r="3" fill="#171B22"/>
  <circle cx="194" cy="149" r="3" fill="#171B22"/>
  <!-- smile -->
  <path d="M172 168 q8 6 16 0" stroke="#171B22" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- headphones -->
  <path d="M138 140 a42 42 0 0 1 84 0" stroke="#6C63FF" stroke-width="9" fill="none" stroke-linecap="round"/>
  <rect x="128" y="132" width="16" height="30" rx="7" fill="#6C63FF"/>
  <rect x="216" y="132" width="16" height="30" rx="7" fill="#6C63FF"/>
  <rect x="131" y="137" width="10" height="20" rx="5" fill="#00C9A7">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="219" y="137" width="10" height="20" rx="5" fill="#00C9A7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- laptop -->
  <rect x="118" y="242" width="124" height="72" rx="8" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <text x="180" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#00C9A7">&lt;/&gt;
    <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
  </text>
  <rect x="106" y="312" width="148" height="9" rx="4" fill="#21262D"/>

  <!-- desk -->
  <rect x="60" y="324" width="240" height="6" rx="3" fill="#1B2129"/>

  <!-- caption -->
  <text x="180" y="360" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="13" fill="#8B949E">// engineer by day · musician by night</text>
  <text x="180" y="386" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="13">
    <tspan fill="#6C63FF">while</tspan><tspan fill="#E6EDF3"> (alive) { </tspan><tspan fill="#00C9A7">code</tspan><tspan fill="#E6EDF3">(); </tspan><tspan fill="#00C9A7">jam</tspan><tspan fill="#E6EDF3">(); }</tspan>
  </text>
  <rect x="285" y="376" width="8" height="13" fill="#00C9A7">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
